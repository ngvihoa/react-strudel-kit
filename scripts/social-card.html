<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social card source</title>
    <style>
      @font-face { font-family: Brand; src: url('/node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-600-normal.woff2'); font-weight: 600; }
      @font-face { font-family: Brand; src: url('/node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-400-normal.woff2'); font-weight: 400; }
      @font-face { font-family: Code; src: url('/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2'); }
      * { box-sizing: border-box; }
      body { margin: 0; width: 1200px; height: 630px; padding: 56px 64px; color: #18152b; background: #fff; font-family: Brand, sans-serif; }
      header { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 600; letter-spacing: -1px; }
      img { width: 100px; height: auto; }
      h1 { margin: 52px 0 28px; font-size: 66px; line-height: 1.16; letter-spacing: -3px; font-weight: 600; }
      h1 span { color: #472dd7; }
      p { margin: 0; font-size: 24px; color: #57516f; }
      footer { display: flex; align-items: center; justify-content: space-between; margin-top: 44px; }
      code { padding: 18px 24px; border-radius: 14px; background: #eeeaff; font: 21px Code, monospace; }
      small { color: #57516f; font-size: 18px; }
    </style>
  </head>
  <body>
    <header><img src="/src/assets/rsk-logo.png" alt="RSK" />react-strudel-kit</header>
    <h1>Write music in TypeScript.<br /><span>Play it with React.</span></h1>
    <p>Typed Strudel patterns. Your interface. Real sound.</p>
    <footer><code>npm install react-strudel-kit</code><small>react-strudel-kit.vercel.app</small></footer>
  </body>
</html>
