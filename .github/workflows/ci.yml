name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Test the packed package in React 18 and 19
        run: npm run test:package
      - name: Test the production learning site
        run: npm run test:e2e
      - name: Save tested package and browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ github.sha }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 7
